  <rect x="154" y="22" width="32" height="22" rx="3" fill="#3f3f46" stroke="#818cf8" stroke-width="2"/><rect x="164" y="44" width="12" height="8" rx="2" fill="#52525b" stroke="#818cf8" stroke-width="2"/>
