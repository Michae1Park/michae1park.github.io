  <path d="M188 194 V 214 H 232 V 194" fill="none" stroke="#5eead4" stroke-width="2.5"/>
  <g transform="translate(202 206) rotate(10) scale(0.75)" opacity="1"><path d="M-13 1 C -13 -6, -5 -9, 2 -8 C 9 -7, 14 -4, 13 1 C 12 6, 5 8, -2 8 C -9 8, -13 6, -13 1 Z" fill="#c98b62"/><path d="M-8 -4 C -3 -6, 3 -6, 7 -4" fill="none" stroke="#e3b38f" stroke-width="2" stroke-linecap="round" opacity=".8"/><circle cx="11" cy="1" r="1.8" fill="#9c6440"/></g>
