<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="400" height="240" fill="#18181b"/>

  <!-- Audio input: speaker icon + waveform -->
  <path d="M22 62h8l10-9v34l-10-9h-8z" fill="#5eead4"/>
  <path d="M46 60q6 10 0 20" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
  <polyline points="58,70 64,58 70,82 76,52 82,88 88,62 94,78 100,56 106,84 112,66 118,74 124,60 130,80 136,68 142,70"
    fill="none" stroke="#5eead4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="58" y="112" font-size="17" fill="#a1a1aa">audio</text>

  <!-- Vision input: ArUco-style marker + position trace -->
  <rect x="20" y="156" width="28" height="28" fill="#f4f4f5"/>
  <rect x="24" y="160" width="20" height="20" fill="#18181b"/>
  <rect x="28" y="164" width="5" height="5" fill="#f4f4f5"/>
  <rect x="35" y="164" width="5" height="5" fill="#f4f4f5"/>
  <rect x="28" y="171" width="5" height="5" fill="#f4f4f5"/>
  <rect x="35" y="175" width="5" height="1" fill="#f4f4f5"/>
  <path d="M58 182 C 78 182, 88 158, 104 160 S 128 176, 142 170"
    fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <text x="58" y="212" font-size="17" fill="#a1a1aa">vision</text>

  <!-- Fusion: both streams merge into the network -->
  <path d="M142 70 C 164 70, 162 102, 179 102" fill="none" stroke="#5eead4" stroke-width="2.5" opacity=".8"/>
  <path d="M142 170 C 164 170, 162 150, 179 150" fill="none" stroke="#818cf8" stroke-width="2.5" opacity=".8"/>

  <!-- Deep learning model -->
  <g stroke="#6366f1" stroke-width="1.5" opacity=".7">
    <line x1="186" y1="102" x2="228" y2="93"/>
    <line x1="186" y1="102" x2="228" y2="115"/>
    <line x1="186" y1="102" x2="228" y2="137"/>
    <line x1="186" y1="102" x2="228" y2="159"/>
    <line x1="186" y1="126" x2="228" y2="93"/>
    <line x1="186" y1="126" x2="228" y2="115"/>
    <line x1="186" y1="126" x2="228" y2="137"/>
    <line x1="186" y1="126" x2="228" y2="159"/>
    <line x1="186" y1="150" x2="228" y2="93"/>
    <line x1="186" y1="150" x2="228" y2="115"/>
    <line x1="186" y1="150" x2="228" y2="137"/>
    <line x1="186" y1="150" x2="228" y2="159"/>
    <line x1="228" y1="93" x2="270" y2="114"/>
    <line x1="228" y1="93" x2="270" y2="138"/>
    <line x1="228" y1="115" x2="270" y2="114"/>
    <line x1="228" y1="115" x2="270" y2="138"/>
    <line x1="228" y1="137" x2="270" y2="114"/>
    <line x1="228" y1="137" x2="270" y2="138"/>
    <line x1="228" y1="159" x2="270" y2="114"/>
    <line x1="228" y1="159" x2="270" y2="138"/>
  </g>
  <g fill="#312e81" stroke="#a5b4fc" stroke-width="2">
    <circle cx="186" cy="102" r="7"/>
    <circle cx="186" cy="126" r="7"/>
    <circle cx="186" cy="150" r="7"/>
    <circle cx="228" cy="93" r="7"/>
    <circle cx="228" cy="115" r="7"/>
    <circle cx="228" cy="137" r="7"/>
    <circle cx="228" cy="159" r="7"/>
    <circle cx="270" cy="114" r="7"/>
    <circle cx="270" cy="138" r="7"/>
  </g>

  <path d="M290 126h8" stroke="#a1a1aa" stroke-width="2.5"/>
  <path d="M296 120l7 6-7 6" fill="none" stroke="#a1a1aa" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Forecast: observed signal, "now", predicted failure 0.5 s ahead -->
  <line x1="344" y1="62" x2="344" y2="164" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M310 132 C 320 122, 332 140, 344 128" fill="none" stroke="#e4e4e7" stroke-width="3" stroke-linecap="round"/>
  <path d="M344 128 C 358 118, 370 100, 384 78" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <circle cx="384" cy="78" r="5" fill="#f87171"/>
  <text x="344" y="58" font-size="16" fill="#a1a1aa">+0.5 s</text>

  <!-- Stop -->
  <polygon points="357,178 371,178 381,188 381,202 371,212 357,212 347,202 347,188" fill="#ef4444"/>
  <rect x="354" y="192" width="20" height="6" rx="1" fill="#fff"/>
</svg>
